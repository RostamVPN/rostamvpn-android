[package]
name = "redsocket-http-core"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "RedSocket HTTP-Upgrade-only Android client core (Noise NK + META + SOCKS5) — drop-in replacement for redsocket-core"

[lib]
name = "redsocket_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
jni = "0.21"
snow = "0.9"
log = { version = "0.4", features = ["release_max_level_warn"] }
android_logger = "0.14"
env_logger = { version = "0.11", optional = true }
hex = "0.4"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "rt", "rt-multi-thread", "macros"] }

yamux = "0.13"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
blake2 = "0.10"
base64 = "0.22"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt", "compat"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "redsocket-cli"
path = "src/bin/redsocket-cli.rs"
required-features = ["cli"]

[features]
cli = ["env_logger"]
