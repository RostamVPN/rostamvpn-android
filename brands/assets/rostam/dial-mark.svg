       SwiftUI port that used to live in rostamvpn/RostamBrandMark.swift.
       Vector, not raster, so nothing is lost by moving it out of code.
       The horns leave the aperture on purpose: the dial's state ring is drawn
       OVER this image, so they pass behind it and the two shapes interlock. -->
